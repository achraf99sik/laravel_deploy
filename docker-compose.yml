services:
    web:
        image: app-name:latest
        build:
            target: web
            context: .
        env_file:
            - .env
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - db

    db:
        platform: "linux/amd64"
        image: postgres:17
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5434:5432"
        volumes:
            - dbdata:/var/lib/postgresql/data
volumes:
    dbdata:
